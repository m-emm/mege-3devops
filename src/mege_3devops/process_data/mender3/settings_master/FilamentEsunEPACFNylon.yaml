# eSun ePA-CF nylon, 20% carbon fiber.
# Dry the filament before printing and use a hardened nozzle.
compatible_printers:
  - MegeMasterMachine
from: system
instantiation: 'true'
is_custom_defined: '0'
name: FilamentEsunEPACFNylon
