# Dedicated high-flow PETG-CF filament for max-strength dual-material prints.
# Keep this separate from FilamentPETGCF so mixed PETG/TPU plates retain the
# TPU filament's own volumetric and cooling limits.
compatible_printers:
  - MegeEnder3V3KEIDEX
from: system
instantiation: "true"
is_custom_defined: "0"
name: FilamentPETGCFMaxStrength
setting_id: ME3VIDEX_PETGCF_MAX_STRENGTH
flament_id: ME3VIDEX_PETGCF_MAX_STRENGTH_1
type: filament
version: 2.0.2.0

close_fan_the_first_x_layers:
  - "3"
full_fan_speed_layer:
  - "0"
overhang_fan_speed:
  - "35"
overhang_fan_threshold:
  - 25%
reduce_fan_stop_start_freq:
  - "1"
slow_down_for_layer_cooling:
  - "0"
slow_down_min_speed:
  - "10"

default_filament_colour:
  - "#222222"
filament_cost:
  - "26"
filament_density:
  - "1.25"
filament_diameter:
  - "1.75"
filament_soluble:
  - "0"
filament_vendor:
  - Generic
temperature_vitrification:
  - "80"

filament_flow_ratio:
  - "1.02"
enable_pressure_advance:
  - "0"
pressure_advance:
  - "0.015"
adaptive_pressure_advance:
  - "0"
adaptive_pressure_advance_bridges:
  - "0"
adaptive_pressure_advance_overhangs:
  - "0"

filament_max_volumetric_speed:
  - "30"

filament_minimal_purge_on_wipe_tower:
  - "15"

bed_type:
  - Cool Plate
cool_plate_temp:
  - "75"
cool_plate_temp_initial_layer:
  - "80"
eng_plate_temp:
  - "75"
eng_plate_temp_initial_layer:
  - "80"
fan_cooling_layer_time:
  - "10"
fan_max_speed:
  - "30"
fan_min_speed:
  - "10"
filament_deretraction_speed:
  - nil
filament_end_gcode:
  - "; filament end gcode \n"
filament_id: ME3VIDEXPETGCFMAXSTRENGTH
filament_retract_before_wipe:
  - nil
filament_retract_restart_extra:
  - nil
filament_retract_when_changing_layer:
  - nil
filament_retraction_length:
  - nil
filament_retraction_minimum_travel:
  - nil
filament_retraction_speed:
  - nil
filament_settings_id:
  - Generic PETG-CF Max Strength @Mege Ender 3 V3 KE IDEX
filament_start_gcode:
  - "; filament start gcode\n"
filament_type:
  - PETG
filament_wipe:
  - nil
filament_wipe_distance:
  - nil
filament_z_hop:
  - nil
filament_z_hop_types:
  - nil
hot_plate_temp:
  - "75"
hot_plate_temp_initial_layer:
  - "80"
nozzle_temperature:
  - "260"
nozzle_temperature_initial_layer:
  - "265"
nozzle_temperature_range_high:
  - "275"
nozzle_temperature_range_low:
  - "245"
slow_down_layer_time:
  - "7"
textured_plate_temp:
  - "75"
textured_plate_temp_initial_layer:
  - "80"
