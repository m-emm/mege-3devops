# === 0_Metadata ===
from: system
instantiation: "true"
is_custom_defined: "0"
name: MegeEnder3V3KEIDEX
printer_model: MegeEnder3V3KEIDEX
printer_settings_id: MegeEnder3V3KEIDEX
setting_id: ME3VIDEX
type: machine
version: 2.0.2.0

# === Basic information / Accessory ===
auxiliary_fan: "0"
nozzle_type: brass
support_air_filtration: "0"
support_chamber_temp_control: "0"

# === Basic information / Advanced ===
gcode_flavor: klipper
printer_structure: i3
scan_first_layer: "0"

# === Basic information / Extruder Clearance ===
extruder_clearance_height_to_lid: "34"
extruder_clearance_height_to_rod: "47"
extruder_clearance_radius: "90"

# === Basic information / Printable space ===
printable_area:
  - 155x55
  - 295x55
  - 295x305
  - 155x305

# === General / Size and coordinates ===
printable_height: "295"

# === Machine limits ===
machine_max_acceleration_extruding:
  - "300"
  - "300"
machine_max_acceleration_retracting:
  - "300"
  - "300"
machine_max_acceleration_travel:
  - "300"
  - "300"
machine_min_extruding_rate:
  - "0"
  - "0"
machine_min_travel_rate:
  - "0"
  - "0"

# === Multimaterial / Advanced ===
machine_load_filament_time: "11"

# === Multimaterial / Layer height limits ===
max_layer_height:
  - "0.32"
min_layer_height:
  - "0.08"

# === Multimaterial / Position ===
extruder_offset:
  - "0x0"

# === Multimaterial / Retraction ===
deretraction_speed:
  - "0"
retract_before_wipe:
  - 100%
retract_restart_extra:
  - "0"
retract_when_changing_layer:
  - "1"
retraction_length:
  - "0.5"
retraction_minimum_travel:
  - "2"
retraction_speed:
  - "30"
wipe:
  - "1"
wipe_distance:
  - "2"

# === Multimaterial / Retraction when switching material ===
retract_length_toolchange:
  - "1"
retract_restart_extra_toolchange:
  - "0"

# === Multimaterial / Single extruder multi-material setup ===
manual_filament_change: "1"
single_extruder_multi_material: "1"

# === Multimaterial / Size ===
nozzle_diameter:
  - "0.4"

# === Multimaterial / Z-Hop ===
z_hop:
  - "0.2"
z_hop_types: Normal Lift

# === Uncategorized ===
bed_exclude_area:
  - "0x0"
before_layer_change_gcode: |
  ;BEFORE_LAYER_CHANGE
  ;[layer_z]

  G92 E0
change_filament_gcode: M600
default_filament_profile:
  - FilamentCrealityPLAHighSpeedTunedForSpeed
default_print_profile: ProcessMegeEnder3V3KEIDEXColdBed
extruder_clearance_max_radius: "90"
extruder_colour:
  - "#FCE94F"
layer_change_gcode: |
  SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
machine_end_gcode: |-
  G92 E0 ; Reset extruder
  G91 ; Relative positioning
  G1 E-1.2 Z5 F600 ; Retract and lift within live Z speed limit
  G90 ; Absolute positioning
  G1 X225 Y180 F1800 ; Present print inside temporary safe zone
  M106 S0 ;Turn-off fan
  M104 S0 ;Turn-off hotend

  M84 X Y E ;Disable all steppers but Z
machine_max_acceleration_e:
  - "300"
  - "300"
machine_max_acceleration_x:
  - "300"
  - "300"
machine_max_acceleration_y:
  - "300"
  - "300"
machine_max_acceleration_z:
  - "30"
  - "30"
machine_max_jerk_e:
  - "5"
  - "5"
machine_max_jerk_x:
  - "5"
  - "5"
machine_max_jerk_y:
  - "5"
  - "5"
machine_max_jerk_z:
  - "0.4"
  - "0.4"
machine_max_speed_e:
  - "40"
  - "40"
machine_max_speed_x:
  - "60"
  - "60"
machine_max_speed_y:
  - "60"
  - "60"
machine_max_speed_z:
  - "8"
  - "8"
machine_pause_gcode: PAUSE
machine_start_gcode: |-
  SET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count]
  M220 S100 ;Reset Feedrate
  M221 S100 ;Reset Flowrate

  G28 ;Home
  IDEX_SELECT_LEFT ;Activate and park the left carriage for this bring-up identity
  G90 ;Absolute positioning
  M82 ;Absolute extrusion

  G92 E0 ;Reset Extruder
  M104 S[nozzle_temperature_initial_layer] ;Set final nozzle temp
  G1 Z2.0 F480 ;Move Z Axis inside current live limit
  G1 X165 Y65 F1800 ;Move to safe purge start
  M109 S[nozzle_temperature_initial_layer] ;Wait for nozzle temp to stabilize
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X165 Y130 E8 F600 ;Draw first purge line inside safe zone
  G1 X170 Y130 F1200 ;Step aside inside safe zone
  G1 X170 Y65 E16 F600 ;Draw second purge line inside safe zone
  G92 E0 ;Reset Extruder
  G1 E-0.8 F1200 ;Retract a bit
  G1 Z2.0 F480 ;Move Z Axis up inside current live limit
  G1 E0.0000 F1200
print_host: menderpi.local:7125
printer_technology: FFF
printer_variant: "0.4"
silent_mode: "0"
thumbnails:
  - 96x96
  - 300x300
