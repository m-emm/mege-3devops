# === 0_Metadata ===
from: system
instantiation: "true"
is_custom_defined: "0"
name: MegeEnder3V3KEIDEX
printer_model: MegeEnder3V3KEIDEX
printer_settings_id: MegeEnder3V3KEIDEX
setting_id: ME3VIDEX
type: machine
version: 2.0.2.0

# === Basic information / Accessory ===
auxiliary_fan: "0"
nozzle_type: brass
support_air_filtration: "0"
support_chamber_temp_control: "0"

# === Basic information / Advanced ===
gcode_flavor: klipper
printer_structure: i3
scan_first_layer: "0"

# === Basic information / Extruder Clearance ===
extruder_clearance_height_to_lid: "34"
extruder_clearance_height_to_rod: "47"
extruder_clearance_radius: "90"

# === Basic information / Printable space ===
printable_area:
  - 0x0
  - 244x0
  - 244x290
  - 0x290

# === General / Size and coordinates ===
printable_height: "294"

# === Machine limits ===
machine_max_acceleration_extruding:
  - "8000"
  - "8000"
machine_max_acceleration_retracting:
  - "5000"
  - "5000"
machine_max_acceleration_travel:
  - "8000"
  - "8000"
machine_min_extruding_rate:
  - "0"
  - "0"
machine_min_travel_rate:
  - "0"
  - "0"

# === Multimaterial / Advanced ===
machine_load_filament_time: "11"

# === Multimaterial / Layer height limits ===
max_layer_height:
  - "0.32"
  - "0.32"
min_layer_height:
  - "0.08"
  - "0.08"

# === Multimaterial / Position ===
extruder_offset:
  - "0x0"
  - "0x0"

# === Multimaterial / Retraction ===
deretraction_speed:
  - "0"
  - "0"
retract_before_wipe:
  - 100%
  - 100%
retract_restart_extra:
  - "0"
  - "0"
retract_when_changing_layer:
  - "1"
  - "1"
retraction_length:
  - "0.5"
  - "0.5"
retraction_minimum_travel:
  - "2"
  - "2"
retraction_speed:
  - "30"
  - "30"
wipe:
  - "1"
  - "1"
wipe_distance:
  - "2"
  - "2"

# === Multimaterial / Retraction when switching material ===
retract_length_toolchange:
  - "1"
  - "1"
retract_restart_extra_toolchange:
  - "0"
  - "0"

# === Multimaterial / Physical IDEX toolchanger setup ===
manual_filament_change: "0"
single_extruder_multi_material: "0"

# === Multimaterial / Size ===
nozzle_diameter:
  - "0.4"
  - "0.4"

# === Multimaterial / Z-Hop ===
z_hop:
  - "0.2"
  - "0.2"
z_hop_types:
  - Normal Lift
  - Normal Lift

# === Uncategorized ===
bed_exclude_area:
  - "0x0"
before_layer_change_gcode: |
  ;BEFORE_LAYER_CHANGE
  ;[layer_z]

  G92 E0
change_filament_gcode: ""
default_filament_profile:
  - FilamentCrealityPLAHighSpeedTunedForSpeed
  - FilamentCrealityPLAHighSpeedTunedForSpeedT1
default_print_profile: ProcessMegeEnder3V3KEIDEXColdBed
extruder_clearance_max_radius: "90"
extruder_colour:
  - "#FF0000"
  - "#0066FF"
layer_change_gcode: |
  SET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}
machine_end_gcode: |-
  G92 E0 ; Reset extruder
  G1 E-1.2 F1200 ; Retract before lift and parking
  G90 ; Absolute positioning
  {if max_layer_z < printable_height}
  G1 Z{min(max_layer_z+150, printable_height)} F480 ; Lift print clear, capped at Z max
  {endif}
  M106 S0 ;Turn-off fan
  T0 ;Park right carriage, select and park left carriage
  M104 S0 ;Turn-off left hotend
  T1 ;Park left carriage, select and park right carriage
  M104 S0 ;Turn-off right hotend
  T0 ;Leave both carriages parked, left tool active
  M140 S0 ;Turn-off bed

  M84 X Y E ;Disable all steppers but Z
machine_max_acceleration_e:
  - "5000"
  - "5000"
machine_max_acceleration_x:
  - "8000"
  - "8000"
machine_max_acceleration_y:
  - "8000"
  - "8000"
machine_max_acceleration_z:
  - "300"
  - "300"
machine_max_jerk_e:
  - "5"
  - "5"
machine_max_jerk_x:
  - "10"
  - "10"
machine_max_jerk_y:
  - "10"
  - "10"
machine_max_jerk_z:
  - "0.4"
  - "0.4"
machine_max_speed_e:
  - "40"
  - "40"
machine_max_speed_x:
  - "500"
  - "500"
machine_max_speed_y:
  - "500"
  - "500"
machine_max_speed_z:
  - "30"
  - "30"
machine_pause_gcode: PAUSE
machine_start_gcode: |-
  SET_PRINT_STATS_INFO TOTAL_LAYER=[total_layer_count]
  M220 S100 ;Reset Feedrate
  M221 S100 ;Reset Flowrate

  M140 S[bed_temperature_initial_layer_single] ;Start bed heating
  G28 ;Home
  G90 ;Absolute positioning
  M82 ;Absolute extrusion
  G1 Y10 F1800 ;Leave Y endstop before applying tool offsets

  {if is_extruder_used[0]}M104 S{first_layer_temperature[0]} T0 ;Preheat left hotend without tool select
  {endif}
  {if is_extruder_used[1]}M104 S{first_layer_temperature[1]} T1 ;Preheat right hotend without tool select
  {endif}

  G1 Z2.0 F480 ;Move Z Axis inside current live limit
  M190 S[bed_temperature_initial_layer_single] ;Wait for bed temp to stabilize

  {if initial_tool==0}T0
  G92 E0 ;Reset left extruder
  G1 X10 Y-8.5 F1800 ;Move to left front purge start in physical bed margin
  M109 S{first_layer_temperature[0]} ;Wait for left hotend
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X110 Y-8.5 E8 F600 ;Draw first left front purge line
  G1 Z0.60 F480 ;Lift before travel to next left purge line
  G1 X110 Y-7.0 F1800 ;Travel to second left front purge start
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X10 Y-7.0 E16 F600 ;Draw second left front purge line
  G1 Z0.60 F480 ;Lift before travel to next left purge line
  G1 X10 Y-5.5 F1800 ;Travel to third left front purge start
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X110 Y-5.5 E24 F600 ;Draw third left front purge line
  G1 Z0.60 F480 ;Lift before travel to next left purge line
  G1 X110 Y-4.0 F1800 ;Travel to fourth left front purge start
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X10 Y-4.0 E32 F600 ;Draw fourth left front purge line
  G1 Z0.60 F480 ;Lift before travel to next left purge line
  G1 X10 Y-2.5 F1800 ;Travel to fifth left front purge start
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X110 Y-2.5 E40 F600 ;Draw fifth left front purge line
  G1 Z0.60 F480 ;Lift before travel to next left purge line
  G1 X110 Y-1.0 F1800 ;Travel to sixth left front purge start
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X10 Y-1.0 E48 F600 ;Draw sixth left front purge line
  G92 E0 ;Reset left extruder
  G1 E-0.8 F1200 ;Retract a bit
  G1 Z2.0 F480 ;Lift after left purge
  {endif}

  {if initial_tool==1}T1
  G92 E0 ;Reset right extruder
  G1 X134 Y-8.5 F1800 ;Move to right front purge start in physical bed margin
  M109 S{first_layer_temperature[1]} ;Wait for right hotend
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X234 Y-8.5 E8 F600 ;Draw first right front purge line
  G1 Z0.60 F480 ;Lift before travel to next right purge line
  G1 X234 Y-7.0 F1800 ;Travel to second right front purge start
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X134 Y-7.0 E16 F600 ;Draw second right front purge line
  G1 Z0.60 F480 ;Lift before travel to next right purge line
  G1 X134 Y-5.5 F1800 ;Travel to third right front purge start
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X234 Y-5.5 E24 F600 ;Draw third right front purge line
  G1 Z0.60 F480 ;Lift before travel to next right purge line
  G1 X234 Y-4.0 F1800 ;Travel to fourth right front purge start
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X134 Y-4.0 E32 F600 ;Draw fourth right front purge line
  G1 Z0.60 F480 ;Lift before travel to next right purge line
  G1 X134 Y-2.5 F1800 ;Travel to fifth right front purge start
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X234 Y-2.5 E40 F600 ;Draw fifth right front purge line
  G1 Z0.60 F480 ;Lift before travel to next right purge line
  G1 X234 Y-1.0 F1800 ;Travel to sixth right front purge start
  G1 Z0.28 F300 ;Lower to first layer purge height
  G1 X134 Y-1.0 E48 F600 ;Draw sixth right front purge line
  G92 E0 ;Reset right extruder
  G1 E-0.8 F1200 ;Retract a bit
  G1 Z2.0 F480 ;Lift after right purge
  {endif}

  T{initial_tool}
  G92 E0 ;Reset active extruder
  G1 E0.0000 F1200
print_host: menderpi.local:7125
printer_technology: FFF
printer_variant: "0.4"
silent_mode: "0"
thumbnails:
  - 96x96
  - 300x300
