# === 0_Metadata ===
compatible_printers:
  - MegeEnder3V3KEIDEX
from: system
instantiation: "true"
is_custom_defined: "0"
name: FilamentCrealityPLAHighSpeedTunedForSpeedT1
setting_id: ME3VIDEX_PLA_COLD_T1
flament_id: ME3VIDEX_PLA_COLD_2
type: filament
version: 2.0.2.0

# === Cooling / Auxiliary part cooling fan ===
additional_cooling_fan_speed:
  - "70"

# === Cooling / Cooling for specific layer ===
close_fan_the_first_x_layers:
  - "1"
full_fan_speed_layer:
  - "0"

# === Cooling / Part cooling fan ===
overhang_fan_speed:
  - "100"
overhang_fan_threshold:
  - 50%
reduce_fan_stop_start_freq:
  - "1"
slow_down_for_layer_cooling:
  - "0"
slow_down_min_speed:
  - "20"

# === Filament / Basic information ===
default_filament_colour:
  - "#0066FF"

filament_cost:
  - "18"
filament_density:
  - "1.24"
filament_diameter:
  - "1.75"
filament_soluble:
  - "0"
filament_vendor:
  - Generic
temperature_vitrification:
  - "60"

# === Filament / Flow ratio and Pressure Advance ===
filament_flow_ratio:
  - "1.0"
# Pressure Advance (Linear Advance) - OFF by default, enable via process_overrides for high-speed profiles
# Value tuned for Ender 3V3 KE with Micro Swiss hotend: 0.02
# Typical range: 0.01-0.06 for direct drive
enable_pressure_advance:
  - "0"
pressure_advance:
  - "0.02"
adaptive_pressure_advance:
  - "0"
adaptive_pressure_advance_bridges:
  - "0"
adaptive_pressure_advance_overhangs:
  - "0"

# === Filament / Volumetric speed limitation ===
filament_max_volumetric_speed:
  - "13"

# === Multimaterial / Wipe tower parameters ===
filament_minimal_purge_on_wipe_tower:
  - "15"

# === Bed Temperature Configuration ===
# Strategy: the live IDEX bring-up printer currently has no configured heatbed
# heater. Keep all plate temperatures at zero so generated G-code does not
# command bed heating.
bed_type:
  - Textured Plate
cool_plate_temp:
  - "0"
cool_plate_temp_initial_layer:
  - "0"
eng_plate_temp:
  - "0"
eng_plate_temp_initial_layer:
  - "0"
supertack_plate_temp:
  - "0"
supertack_plate_temp_initial_layer:
  - "0"
fan_cooling_layer_time:
  - "100"
fan_max_speed:
  - "100"
fan_min_speed:
  - "100"
filament_deretraction_speed:
  - nil
filament_end_gcode:
  - "; filament end gcode \n"
filament_id: ME3VIDEXPLA_T1
filament_retract_before_wipe:
  - nil
filament_retract_restart_extra:
  - nil
filament_retract_when_changing_layer:
  - nil
filament_retraction_length:
  - nil
filament_retraction_minimum_travel:
  - nil
filament_retraction_speed:
  - nil
filament_settings_id:
  - PLA Cold Bed T1 @Mege Ender 3 V3 KE IDEX
filament_start_gcode:
  - "; filament start gcode\n"
filament_type:
  - PLA
filament_wipe:
  - nil
filament_wipe_distance:
  - nil
filament_z_hop:
  - nil
filament_z_hop_types:
  - nil
